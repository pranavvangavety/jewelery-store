spring.application.name=api-gateway
server.port = 8080

eureka.client.service-url.defaultZone = http://localhost:8761/eureka/

spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

jwt.secret=${JWT_SECRET}

# Redis (dev) - backs the gateway's RequestRateLimiter. Non-secret dev literals.
spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://auth-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[1].id=user-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://user-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/users/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[2].id=product-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://product-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/products/**,/api/categories/**, /api/featured/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[3].id=cart-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://cart-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/cart/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[4].id=order-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://order-service
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/orders/**
spring.cloud.gateway.server.webflux.routes[4].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[5].id=inventory-service
spring.cloud.gateway.server.webflux.routes[5].uri=lb://inventory-service
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/inventory/**
spring.cloud.gateway.server.webflux.routes[5].filters[0]=StripPrefix=1

# Dedicated, more-specific route for the two sensitive auth endpoints (login, register)
# ONLY. Lower order (-1) so it is matched BEFORE the broad /api/auth/** route (order 0),
# which otherwise would also match these paths. Per-IP rate limited via Redis -> HTTP 429
# when the bucket is exhausted. Other /api/auth/** endpoints (verify-email, forgot-password,
# reset-password, resend-verification) fall through to routes[0] and stay unthrottled.
spring.cloud.gateway.server.webflux.routes[6].id=auth-service-ratelimit
spring.cloud.gateway.server.webflux.routes[6].uri=lb://auth-service
spring.cloud.gateway.server.webflux.routes[6].order=-1
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/auth/login,/api/auth/register
spring.cloud.gateway.server.webflux.routes[6].filters[0]=StripPrefix=1
spring.cloud.gateway.server.webflux.routes[6].filters[1].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[6].filters[1].args.key-resolver=#{@ipKeyResolver}
spring.cloud.gateway.server.webflux.routes[6].filters[1].args.redis-rate-limiter.replenishRate=1
spring.cloud.gateway.server.webflux.routes[6].filters[1].args.redis-rate-limiter.burstCapacity=5
spring.cloud.gateway.server.webflux.routes[6].filters[1].args.redis-rate-limiter.requestedTokens=1

spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origins=${FRONTEND_ORIGIN:http://localhost:5173}
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods=GET, POST, PUT, PATCH, DELETE, OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers=Authorization, Content-Type, X-Session-Id
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allow-credentials=true